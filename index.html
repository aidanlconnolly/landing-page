<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aidan Connolly</title>
  <link rel="stylesheet" href="style.css" />
  <style>
/* ── Reset & base ────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:   #0a1628;
  --bg:     #ffffff;
  --card:   #ffffff;
  --border: #e8eaed;
  --text:   #1a1a2e;
  --muted:  #6b7280;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 12px;
}

html.dark {
  --bg:     #0d1117;
  --card:   #161b22;
  --border: #30363d;
  --text:   #e6edf3;
  --muted:  #8b949e;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
}

html { font-size: 16px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
}

.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* ── Header ──────────────────────────────────────── */
header {
  background: var(--navy);
  color: #fff;
  padding: 56px 0 48px;
  position: relative;
}

.header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 28px; }

.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  border: 3px solid rgba(255,255,255,0.25);
  flex-shrink: 0;
}

.header-text { flex: 1; }

.header-controls {
  position: absolute;
  top: 20px;
  right: 24px;
  display: flex;
  gap: 10px;
}

.icon-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  border-radius: 8px;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: background 0.2s;
}
.icon-btn:hover { background: rgba(255,255,255,0.22); }

h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 10px;
}

.bio { font-size: 1.05rem; color: rgba(255,255,255,0.72); max-width: 520px; }

/* ── Main ────────────────────────────────────────── */
main { padding: 52px 0 40px; }
section + section { margin-top: 52px; }

.section-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--navy);
  margin-bottom: 20px;
}
html.dark .section-label { color: #58a6ff; }

/* ── Grid ────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 18px;
}

/* ── Card ────────────────────────────────────────── */
.card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px 22px 22px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  position: relative;
  overflow: hidden;
}

.card:not(.soon):hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(10,22,40,0.13);
  border-color: var(--navy);
}
html.dark .card:not(.soon):hover { border-color: #58a6ff; }

.card-icon  { font-size: 2.4rem; line-height: 1; margin-bottom: 14px; display: block; }
.card-name  { font-size: 0.975rem; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
html.dark .card-name { color: #e6edf3; }
.card-desc  { font-size: 0.82rem; color: var(--muted); line-height: 1.45; }

/* Coming soon */
.card.soon  { opacity: 0.42; cursor: default; pointer-events: none; }

.badge {
  position: absolute;
  top: 12px; right: 12px;
  background: var(--navy);
  color: #fff;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 99px;
}
html.dark .badge { background: #30363d; color: #8b949e; }

/* ── Modal ───────────────────────────────────────── */
.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop.open { display: flex; }

.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.22);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 1.05rem; font-weight: 700; }
.modal-close {
  background: none; border: none; cursor: pointer;
  font-size: 1rem; color: var(--muted); padding: 4px 8px;
  border-radius: 6px; transition: background 0.15s;
}
.modal-close:hover { background: var(--border); }
.modal-body { padding: 20px 24px 24px; }

.ext-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
}
.ext-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.ext-icon { font-size: 2rem; line-height: 1; }
.ext-name { font-weight: 700; font-size: 0.95rem; }
.ext-sub { font-size: 0.8rem; color: var(--muted); }
.ext-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }

.install-steps { }
.install-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 10px; }
.install-steps ol { padding-left: 18px; font-size: 0.84rem; color: var(--text); line-height: 1.7; }
.install-steps code {
  background: var(--border); padding: 1px 5px;
  border-radius: 4px; font-size: 0.8rem; font-family: monospace;
}
.dl-btn {
  display: inline-block;
  margin-top: 16px;
  background: var(--navy);
  color: #fff;
  text-decoration: none;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  transition: opacity 0.15s;
}
.dl-btn:hover { opacity: 0.85; }
html.dark .dl-btn { background: #58a6ff; color: #0d1117; }

/* button-style card (modal trigger) */
button.card {
  width: 100%; text-align: left;
  cursor: pointer; font: inherit;
}

/* ── Footer ──────────────────────────────────────── */
footer {
  border-top: 1px solid var(--border);
  padding: 28px 0 32px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}
footer a { color: var(--navy); font-weight: 600; text-decoration: none; }
footer a:hover { text-decoration: underline; }
html.dark footer a { color: #58a6ff; }

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  header { padding: 52px 0 36px; }
}
@media (max-width: 400px) {
  .grid { grid-template-columns: 1fr 1fr; }
}
  </style>

// ── Render ────────────────────────────────────────────────────────
function renderLive(p) {
  if (p.modal) return `<button class="card" onclick="openModal('${p.modal}')">
       <span class="card-icon">${p.icon}</span>
       <div class="card-name">${p.name}</div>
       <div class="card-desc">${p.desc}</div>
     </button>`;
  return `<a class="card" href="${p.url}" target="_blank" rel="noopener noreferrer">
       <span class="card-icon">${p.icon}</span>
       <div class="card-name">${p.name}</div>
       <div class="card-desc">${p.desc}</div>
     </a>`;
}

function renderSoon(p) {
  return `<span class="card soon">
    <span class="badge">Coming Soon</span>
    <span class="card-icon">${p.icon}</span>
    <div class="card-name">${p.name}</div>
    <div class="card-desc">${p.desc}</div>
  </span>`;
}

[
  { id: 'startupFull', cat: 'startup_full' },
  { id: 'games',       cat: 'games'    },
  { id: 'sports',      cat: 'sports'   },
  { id: 'prof',        cat: 'prof'     },
  { id: 'finance',     cat: 'finance'  },
  { id: 'startup',     cat: 'startup'  },
  { id: 'learning',    cat: 'learning' },
  { id: 'personal',    cat: 'personal' },
].forEach(({ id, cat }) => {
  const cards = [
    ...LIVE.filter(p => p.category === cat).map(renderLive),
    ...SOON.filter(p => p.category === cat).map(renderSoon),
  ];
  document.getElementById(id + 'Grid').innerHTML = cards.join('');
});

};

function openModal(id) {
  const m = MODALS[id]; if (!m) return;
  document.getElementById('modalTitle').textContent = m.title;
  document.getElementById('modalBody').innerHTML = m.html;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Dark mode ─────────────────────────────────────────────────────
const darkBtn = document.getElementById('darkBtn');

function applyDark(on) {
  document.documentElement.classList.toggle('dark', on);
  darkBtn.textContent = on ? '☀️' : '🌙';
}

darkBtn.addEventListener('click', () => {
  const on = !document.documentElement.classList.contains('dark');
  applyDark(on);
  localStorage.setItem('dark', on);
});

applyDark(localStorage.getItem('dark') === 'true');
</script>
