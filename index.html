<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aidan Connolly</title>
  <link rel="stylesheet" href="style.css" />
  <style>
/* ── Reset & base ────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:   #0a1628;
  --bg:     #ffffff;
  --card:   #ffffff;
  --border: #e8eaed;
  --text:   #1a1a2e;
  --muted:  #6b7280;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 12px;
}

html.dark {
  --bg:     #0d1117;
  --card:   #161b22;
  --border: #30363d;
  --text:   #e6edf3;
  --muted:  #8b949e;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
}

html { font-size: 16px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
}

.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* ── Header ──────────────────────────────────────── */
header {
  background: var(--navy);
  color: #fff;
  padding: 56px 0 48px;
  position: relative;
}

.header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

.header-controls {
  position: absolute;
  top: 20px;
  right: 24px;
  display: flex;
  gap: 10px;
}

.icon-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  border-radius: 8px;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: background 0.2s;
}
.icon-btn:hover { background: rgba(255,255,255,0.22); }

h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 10px;
}

.bio { font-size: 1.05rem; color: rgba(255,255,255,0.72); max-width: 520px; }

/* ── Main ────────────────────────────────────────── */
main { padding: 52px 0 40px; }
section + section { margin-top: 52px; }

.section-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--navy);
  margin-bottom: 20px;
}
html.dark .section-label { color: #58a6ff; }

/* ── Grid ────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 18px;
}

/* ── Card ────────────────────────────────────────── */
.card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px 22px 22px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow);
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  position: relative;
  overflow: hidden;
}

.card:not(.soon):hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(10,22,40,0.13);
  border-color: var(--navy);
}
html.dark .card:not(.soon):hover { border-color: #58a6ff; }

.card-icon  { font-size: 2.4rem; line-height: 1; margin-bottom: 14px; display: block; }
.card-name  { font-size: 0.975rem; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
html.dark .card-name { color: #e6edf3; }
.card-desc  { font-size: 0.82rem; color: var(--muted); line-height: 1.45; }

/* Coming soon */
.card.soon  { opacity: 0.42; cursor: default; pointer-events: none; }

.badge {
  position: absolute;
  top: 12px; right: 12px;
  background: var(--navy);
  color: #fff;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 99px;
}
html.dark .badge { background: #30363d; color: #8b949e; }

/* ── Footer ──────────────────────────────────────── */
footer {
  border-top: 1px solid var(--border);
  padding: 28px 0 32px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}
footer a { color: var(--navy); font-weight: 600; text-decoration: none; }
footer a:hover { text-decoration: underline; }
html.dark footer a { color: #58a6ff; }

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  header { padding: 52px 0 36px; }
}
@media (max-width: 400px) {
  .grid { grid-template-columns: 1fr 1fr; }
}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-controls">
      <button class="icon-btn" id="darkBtn" aria-label="Toggle dark mode">🌙</button>
    </div>
    <h1>Aidan Connolly</h1>
    <p class="bio">Building things at the intersection of tech and everyday life.</p>
  </div>
</header>

<main>
  <div class="container">

    <section>
      <p class="section-label">Projects</p>
      <div class="grid" id="liveGrid"></div>
    </section>

    <section>
      <p class="section-label">In the Works</p>
      <div class="grid" id="soonGrid"></div>
    </section>

  </div>
</main>

<footer>
  <div class="container">
    For inquiries: <a href="mailto:aidanlconnolly@gmail.com">aidanlconnolly@gmail.com</a>
  </div>
</footer>

<script>
// ── LIVE PROJECTS — updated by /update-landing-page ──────────────
const LIVE = [
  { name: 'Job Finder App',  url: 'https://aidanlconnolly.github.io/jobfinder/',      icon: '💼', desc: 'Search and track job opportunities'        },
  { name: 'Resume Website',  url: 'https://aidanlconnolly.github.io/aidanlconnolly/', icon: '📄', desc: 'Personal portfolio and resume'              },
  { name: 'Golf Range Game', url: 'https://golf-range.vercel.app/',                   icon: '⛳', desc: 'Browser-based golf driving range game'      },
  { name: 'Santorini Guide', url: 'https://santorini-guide.vercel.app/',              icon: '✈️', desc: 'Travel guide for Santorini, Greece'         },
  { name: 'Landing Pages',   url: '/',                                                icon: '🌐', desc: 'This page — pet projects as clickable cards' },
];

// ── COMING SOON — edit descriptions freely ────────────────────────
const SOON = [
  { name: 'Google Extensions',        icon: '🔌', desc: 'Clean up the web with custom browser extensions'                                        },
  { name: 'Tower Game',               icon: '🎮', desc: 'A browser-based tower defence game'                                                      },
  { name: 'Travel Itinerary App',     icon: '🗺️', desc: 'Plan and visualize travel itineraries'                                                   },
  { name: 'Personal Finance Tracker', icon: '💰', desc: 'Dashboard: Marcus, BofA & SoFi accounts, cash-flow forecasting, and stock sell strategy' },
  { name: 'Startup Idea Generator',   icon: '💡', desc: 'Good ideas for common and niche problems'                                                },
  { name: 'Personal Doctor',          icon: '🩺', desc: 'Track recurring health issues and symptoms over time'                                    },
  { name: 'Golf Swing Assessor',      icon: '🏌️', desc: 'Compare swing videos to pinpoint differences'                                           },
  { name: 'World Cup Picker',         icon: '⚽', desc: 'Group stage and bracket predictor'                                                       },
  { name: 'Dream Career Picker',      icon: '🚀', desc: 'Explore and map out future career paths'                                                 },
  { name: 'Santorini Itinerary',      icon: '🏝️', desc: 'Full dream trip: ATVs, Red Beach, cliff jumping, best hotels & restaurants'             },
  { name: 'Learn to Code',            icon: '📚', desc: 'Claude Code upskilling resources and progress tracker'                                   },
  { name: 'Maximize Amex Credits',    icon: '💳', desc: 'Track and maximize Amex card statement credits'                                          },
];

// ── Render ────────────────────────────────────────────────────────
document.getElementById('liveGrid').innerHTML = LIVE.map(p => `
  <a class="card" href="${p.url}" target="_blank" rel="noopener noreferrer">
    <span class="card-icon">${p.icon}</span>
    <div class="card-name">${p.name}</div>
    <div class="card-desc">${p.desc}</div>
  </a>`).join('');

document.getElementById('soonGrid').innerHTML = SOON.map(p => `
  <span class="card soon">
    <span class="badge">Coming Soon</span>
    <span class="card-icon">${p.icon}</span>
    <div class="card-name">${p.name}</div>
    <div class="card-desc">${p.desc}</div>
  </span>`).join('');

// ── Dark mode ─────────────────────────────────────────────────────
const darkBtn = document.getElementById('darkBtn');

function applyDark(on) {
  document.documentElement.classList.toggle('dark', on);
  darkBtn.textContent = on ? '☀️' : '🌙';
}

darkBtn.addEventListener('click', () => {
  const on = !document.documentElement.classList.contains('dark');
  applyDark(on);
  localStorage.setItem('dark', on);
});

applyDark(localStorage.getItem('dark') === 'true');
</script>
</body>
</html>
